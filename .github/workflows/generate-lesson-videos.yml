name: Generate lesson videos

on:
  push:
    branches: [main]
    paths:
      - 'tools/lessons/*.json'
      - 'tools/make_video.py'
      - '.github/workflows/generate-lesson-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-videos:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-ipafont-gothic

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow edge-tts

      - name: Build missing or updated videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p videos
          built=0
          for spec in tools/lessons/*.json; do
            base="$(basename "$spec" .json)"
            out="videos/${base//_/-}.mp4"
            if [[ ! -f "$out" || "$spec" -nt "$out" || tools/make_video.py -nt "$out" ]]; then
              echo "Generating $out from $spec"
              python tools/make_video.py "$spec" "$out"
              built=1
            fi
          done
          echo "built=$built" >> "$GITHUB_ENV"

      - name: Commit generated videos
        if: env.built == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/*.mp4
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m '動画を自動生成 [skip ci]'
          git push
