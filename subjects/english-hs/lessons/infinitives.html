<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不定詞 to do の3用法｜高校英語 第4回</title><meta name="description" content="to不定詞の名詞用法・形容詞用法・副詞用法を例文で整理。"><link rel="stylesheet" href="../../../assets/style.css"></head><body><main class="wrap"><div class="breadcrumb"><a href="../index.html">高校英語</a> ／ 第4回 不定詞</div><h1>第4回　不定詞 to do の3用法</h1><video controls preload="metadata" src="../../../videos/english-infinitives.mp4"></video><div class="panel accent"><strong>to + 動詞原形</strong>を「名詞・形容詞・副詞」のどれとして使っているか判定します。</div><h2>3用法</h2><ol class="steps"><li><strong>名詞用法</strong>「～すること」<div class="formula">I want to study English.</div></li><li><strong>形容詞用法</strong> 名詞を後ろから説明<div class="formula">I have homework to do.</div></li><li><strong>副詞用法</strong>「～するために」<div class="formula">I went to the library to study.</div></li></ol><p><a href="modals.html">← 第3回</a> ｜ <a href="gerunds.html">第5回 →</a></p></main></body></html>
